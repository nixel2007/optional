name: Публикация релиза

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      pool:
        description: Пул хаба
        required: false
        default: default

permissions:
  contents: read
  id-token: write

jobs:
  release:
    uses: autumn-library/workflows/.github/workflows/release.yml@v1
    with:
      package_mask: "optional-*.ospx"
      trusted_publishing: true
      pool: ${{ inputs.pool }}
