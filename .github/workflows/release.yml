name: Публикация релиза

on:
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    uses: autumn-library/workflows/.github/workflows/release.yml@v1
    with:
      oscript_version: stable
      package_mask: optional-*.ospx
    secrets:
      PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
